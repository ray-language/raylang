# CI de raylang (M42.3; NIVELES en IDEAS §82). Tres niveles por evento:
#
# - PR: clippy + la batería completa de `cargo test` (incluye las guardas naming/fmt/docs_root,
#   el humo del fuzzer y del harness diferencial) + el job wasm32. Los pasos PESADOS (corpus
#   nativo, campaña diferencial, builds de release/solo-VM) NO corren aquí: un rojo de esos se
#   detecta como mucho un merge tarde, en main, donde se bisecta fácil. La batería de tests SÍ
#   corre entera a propósito — los E2E son la red real (el bug del terminal crudo de #207 lo
#   cazó un E2E); "tests dirigidos" en CI sería una selección sin el grafo del loader = huecos.
# - push a main: todo (la suite + corpus + diferencial + builds), como siempre.
# - cron nocturno: lo prolongado (fuzz con presupuesto alto, campaña diferencial larga, deps en
#   vivo contra GitHub real).
#
# Cambios SOLO-DOCS (md/book/docs/site) no disparan este workflow — nada de lo que compila
# depende de ellos (site/ lo construye pages.yml; las guardas de .ray no leen markdown).
# Aparte, `audit` revisa las dependencias (la única excepción a la invariante cero-deps:
# rustls/ring/webpki) contra los avisos de RustSec.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "book/**"
      - "docs/**"
      - "site/**"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "book/**"
      - "docs/**"
      - "site/**"
      - "LICENSE*"
  schedule:
    # Fuzzing nocturno prolongado (03:17 UTC; minuto no-redondo para no coincidir con el pico de cron).
    - cron: "17 3 * * *"

# Un push nuevo a un PR CANCELA la corrida obsoleta del commit anterior (gasto de runner puro:
# su resultado ya no le importa a nadie). En main y en el cron nocturno jamás se cancela — ahí
# cada corrida importa. (El patrón "feature/**" del push era letra muerta: las ramas van en feat/.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lints + tests + build. Es el grueso: si algo se rompe, aquí se ve. (No hay paso de `cargo fmt
  # --check`: el código usa alineación manual de comentarios deliberada que rustfmt reformatearía; el
  # estilo del proyecto no es el de rustfmt por defecto. El código RAYLANG sí se comprueba, pero desde
  # dentro de `cargo test`: `tests/fmt_policy.rs` asevera que todo `.ray` versionado es un punto fijo
  # de `ray fmt` — no hace falta un paso propio.)
  test:
    name: clippy · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estable (con clippy)
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Caché de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            # Caché del backend nativo (`ray build --native`): los tests `build_native_*` con crate
            # (TLS/crypto/SQLite) compilan ring/rustls/rusqlite-bundled en este target compartido. Sin
            # cachearlo se recompilaban en cada run (minutos). Ver docs/transpilador-nativo.md §3.3.
            ~/.ray/native-cache
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Clippy
        run: cargo clippy --all-targets
      # Los tests `build_native_*` se SALTAN en silencio si falta `rustc` (en local es honesto; en CI
      # sería un falso verde). Se verifica su presencia para que un toolchain roto falle ruidosamente aquí.
      - name: Verificar rustc (los tests nativos lo requieren)
        run: rustc --version
      # `--no-fail-fast`: que un binario rojo no ENMASCARE a los siguientes — la cadena
      # docs_root → mcp → registry → selfhost (ago 2026) se destapó de uno en uno, un run
      # de ~9 min por eslabón, porque cada fallo abortaba la suite y escondía el resto.
      - name: Tests (incluye el fuzzer del front-end)
        run: cargo test --no-fail-fast
      # ---- Pasos del nivel MAIN/NIGHTLY (IDEAS §82): en PRs se saltan — su rojo se detecta como
      # ---- mucho un merge tarde, en main, y el PR baja de ~17 a ~la mitad. El humo del harness
      # ---- diferencial (1 batch) sigue corriendo en PRs dentro de `cargo test`.
      # El corpus nativo corre en cada push a main (histórico: solo-nocturno tardaba 24 h en
      # avisar). Con la caché de `~/.ray/native-cache` y el target compartido tarda ~2-3 min.
      - name: Corpus nativo ≡ VM (ejemplos deterministas)
        if: github.event_name != 'pull_request'
        run: cargo test --test native_corpus -- --ignored --nocapture
      # M120: el harness DIFERENCIAL — programas GENERADOS (interacciones de features que los
      # ejemplos idiomáticos no ejercitan), 3 motores byte a byte, bisección automática al divergir.
      - name: Harness diferencial de motores (generativo)
        if: github.event_name != 'pull_request'
        run: cargo test --test native_differential -- --ignored --nocapture
      - name: Build de release
        if: github.event_name != 'pull_request'
        run: cargo build --release
      # La release mínima excluye el intérprete (solo-VM). No se corren tests aquí: los oráculos
      # comparan intérprete↔VM y necesitan la feature `interp`; basta con verificar que compila.
      - name: Build solo-VM (sin intérprete)
        if: github.event_name != 'pull_request'
        run: cargo build --release --no-default-features
  # Guarda del playground web (IDEAS §57 + §74): el target wasm no compila en ningún otro paso y
  # ya se rompió en silencio TRES veces (P0.1 metió aHash→getrandom incondicional; M98/M100
  # desbordes de usize de 32 bits y un stub ausente — PR #102; y M100v3/M124/M126/M131 usos de
  # ray_runtime sin guarda de target — PR #182). La tercera se coló porque el paso vivía al FINAL
  # del job de tests: cualquier rojo anterior lo dejaba sin ejecutar y el fallo de wasm quedaba
  # enmascarado. Por eso ahora es un JOB propio: corre siempre, en paralelo, y reporta solo. El
  # artefacto no va al repo (se construye con `sh playground/build.sh`); basta con que el lib
  # compile al target.
  # Windows (M165): el zip que publica release.yml no tenía quien lo probara. Build + humo de la VM
  # + el instalador REAL (install.ps1 contra la última release publicada) + `ray upgrade --check`.
  # Desde M168–M175 corren aquí las suites de señales, red, ray dev, term/io y procesos; los
  # huecos que quedan (ui/audio, reactor IOCP del nativo) los lista docs/windows.md.
  windows:
    name: build · smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estable
        run: rustup toolchain install stable --profile minimal
      - name: Caché de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-win-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (bin ray)
        run: cargo build --release --bin ray
      - name: Humo de la VM (fib + fmt + tests de un ejemplo)
        shell: pwsh
        run: |
          $ray = "target/release/ray.exe"
          & $ray version
          $out = & $ray run examples/basics/fib.ray
          if ($LASTEXITCODE -ne 0) { throw "ray run fib.ray salió $LASTEXITCODE" }
          Write-Host $out
          & $ray fmt examples/basics/fib.ray | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ray fmt salió $LASTEXITCODE" }
      - name: Tests del front-end y la VM (los que no dependen de unix)
        run: cargo test --release --lib -- lexer parser checker compiler vm::tests fmt lsp poll
      # M168: signals() en Windows (SetConsoleCtrlHandler) — VM, binario NATIVO (primer build
      # --native en un host Windows bajo CI: fibras apagadas por host) y el handler simulado.
      - name: signals() en Windows (VM + nativo + handler de consola)
        run: cargo test --release --test signals_portable_cli -- --nocapture
      # M170: la red sin poller — accept/read/write aparcados sin fd se reintentan por busy-poll (antes
      # el scheduler los tomaba por durmientes y todo servidor colgaba en el primer accept).
      - name: Red sin poller (par local + webserver y fetch locales)
        run: cargo test --release --test net_no_poller_cli -- --nocapture
      # M172 (W3): `ray dev` en Windows — reinicio con drenado (CTRL_BREAK al grupo del hijo),
      # sin huérfanos (Job Object) y socket-activation (handle heredable). El supervisor bajo test
      # recibe una consola propia oculta (CREATE_NO_WINDOW), así que no depende de la del runner.
      - name: ray dev en Windows (drenado, Job Object, socket-activation)
        run: |
          cargo test --release --lib -- dev_host
          cargo test --release --test dev_cli --test fs_watch_cli --test test_watch_cli -- --nocapture
      # M173 (W4): std/term y std/io por la Console API — `is_tty`/`size`/`raw` reales bajo una
      # consola NUEVA (`cmd /c start /wait /min`), stdin que no bloquea la VM y `read_timeout` que
      # vence; VM y binario nativo. Las suites completas (decoder, sin-tty, pipes) corren aquí.
      - name: std/term y std/io en Windows (consola real, pipes, timeouts)
        run: cargo test --release --test term_cli --test io_cli -- --nocapture
      # M175 (W6): std/process en Windows — el contrato de `run` con cmd (exit≠0, stdin, ENOENT,
      # timeout con escalera CTRL_BREAK → Job Object, merge, tope) y la sesión con stdin abierto,
      # en VM, intérprete y binario nativo (antes, W2 rechazaba std/process en el nativo).
      - name: std/process en Windows (run, timeout, sesión; VM + intérprete + nativo)
        run: cargo test --release --test process_windows_cli -- --nocapture
      # M177 (W7, paso S): std/ui compila en Windows y el backend headless funciona ahí (los tests
      # de ui dejan de ser ciegos); una ventana real sigue devolviendo el Err de plataforma.
      # M178: std/audio compila en Windows (WASAPI); el runner no tiene dispositivo, así que la
      # batería corre contra el sumidero nulo (RAY_AUDIO_SINK=null), en los tres motores. Con eso el
      # gate de M169 queda vacío en Windows (todo subsistema compila) y su paso desaparece.
      - name: std/ui headless y std/audio (sumidero nulo) en Windows (VM + intérprete + nativo)
        run: cargo test --release --test ui_cli --test audio_cli --test bundle_cli -- --nocapture
      # M166: un proyecto CON dependencias — el runner tiene el `core.autocrlf=true` de Git for
      # Windows, exactamente el escenario que rompía el hash del lock ("possible tampering").
      - name: Proyecto con dependencias del índice (resolución + lock bajo autocrlf)
        shell: pwsh
        run: |
          git config --global core.autocrlf true
          $ray = Join-Path (Get-Location) "target/release/ray.exe"
          Set-Location $env:RUNNER_TEMP
          & $ray new depdemo
          if ($LASTEXITCODE -ne 0) { throw "ray new salió $LASTEXITCODE" }
          Set-Location depdemo
          & $ray add net
          if ($LASTEXITCODE -ne 0) { throw "ray add net salió $LASTEXITCODE" }
          & $ray build
          if ($LASTEXITCODE -ne 0) { throw "ray build con dependencias salió $LASTEXITCODE" }
          # Segunda resolución sobre el mismo lock: es la que fallaba con CRLF.
          & $ray build
          if ($LASTEXITCODE -ne 0) { throw "la re-verificación del lock salió $LASTEXITCODE" }
      - name: Instalador real (install.ps1 contra la última release) + ray upgrade --check
        shell: pwsh
        env:
          RAYLANG_BIN_DIR: ${{ runner.temp }}\raylang-bin
        run: |
          $env:RAYLANG_DRY_RUN = "1"
          ./install.ps1
          Remove-Item Env:RAYLANG_DRY_RUN
          ./install.ps1
          $installed = Join-Path $env:RAYLANG_BIN_DIR "ray.exe"
          & $installed version
          if ($LASTEXITCODE -ne 0) { throw "el ray.exe instalado no arranca" }
          & $installed run examples/basics/fib.ray | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "el ray.exe instalado no ejecuta" }
          # `ray upgrade --check` se prueba con el binario RECIÉN CONSTRUIDO (el instalado es la
          # última release, que puede no traer todavía el soporte de Windows). 0 = al día,
          # 1 = hay versión nueva; ambos válidos — lo que no vale es 69 (plataforma no soportada).
          & target/release/ray.exe upgrade --check
          if ($LASTEXITCODE -gt 1) { throw "ray upgrade --check salió $LASTEXITCODE" }
          # El paso termina con el código del ÚLTIMO comando nativo: un 1 legítimo lo pondría en rojo.
          exit 0

  wasm:
    name: build wasm32 (playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estable + target wasm32
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Caché de cargo (target wasm propio)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build wasm32 (lib release)
        run: cargo build --target wasm32-unknown-unknown --lib --release

  # Auditoría de dependencias contra la base de avisos de seguridad de RustSec. Se aparta del job
  # principal porque instala una herramienta y consulta una base remota (más lento, distinto fallo).
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estable
        run: rustup toolchain install stable --profile minimal
      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked
      - name: Auditar Cargo.lock
        run: cargo audit

  # Fuzzing prolongado, programado (no en cada push): muchas más iteraciones que el `cargo test` de arriba.
  # El fuzzer es determinista y sembrado, así que un hallazgo trae su semilla exacta para reproducir.
  fuzz-nocturno:
    name: fuzz nocturno (prolongado)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estable
        run: rustup toolchain install stable --profile minimal
      - name: Fuzz del front-end (presupuesto alto)
        env:
          RAYLANG_FUZZ_ITERS: "200000"
        run: cargo test --test fuzz_frontend -- --nocapture
      # M120: campaña diferencial prolongada — muchos más batches (semillas rotadas) que el push.
      - name: Harness diferencial (presupuesto alto)
        env:
          RAYLANG_DIFF_BATCHES: "40"
        run: cargo test --test native_differential -- --ignored --nocapture
      # M134: el manejador de paquetes contra la infraestructura REAL (github.com/ray-language:
      # cápsula `greeting` + índice `ray-index`, consumo anónimo por https). Red real → nightly,
      # no en cada push; si GitHub está inaccesible el test se salta con aviso.
      - name: Manejador de paquetes en vivo (GitHub real)
        run: cargo test --test deps_live_cli -- --ignored --nocapture
