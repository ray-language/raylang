# Deploy del SITIO a GitHub Pages (IDEAS §74, fase 3). En cada push a main: construye el
# playground (wasm de la VM+LSP y el bundle CodeMirror del editor), genera el sitio con el
# PROPIO lenguaje (site/site.ray) y lo publica. Requiere Settings → Pages → Source: "GitHub
# Actions" (activado por el usuario, 26 ago 2026). URL: https://ray-language.github.io/raylang/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; un push nuevo cancela el que estuviera en vuelo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: generar el sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estable + target wasm32 + binaryen
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          sudo apt-get update -q && sudo apt-get install -yq binaryen
      - name: Caché de cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pages-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # wasm-opt es MEJOR-ESFUERZO: optimiza a un temporal con SOLO las features que emite
      # rustc (--all-features dejó al binaryen de Ubuntu escribir un value type que el
      # navegador rechaza — "invalid value type 0x3", deploy roto) y el optimizado se adopta
      # únicamente si INSTANCIA en V8 (node); si no, se publica el wasm sin optimizar.
      - name: "Playground: wasm de la VM + LSP (release, wasm-opt validado)"
        run: |
          cargo build --target wasm32-unknown-unknown --lib --release
          cp target/wasm32-unknown-unknown/release/raylang.wasm playground/raylang.wasm
          wasm-opt -Oz --enable-bulk-memory --enable-sign-ext --enable-mutable-globals \
            --enable-nontrapping-float-to-int playground/raylang.wasm -o /tmp/opt.wasm || true
          if [ -f /tmp/opt.wasm ] && node -e "WebAssembly.instantiate(require('fs').readFileSync('/tmp/opt.wasm'),{}).then(()=>process.exit(0),()=>process.exit(1))"; then
            mv /tmp/opt.wasm playground/raylang.wasm
            echo "wasm-opt adoptado ($(du -h playground/raylang.wasm | cut -f1))"
          else
            echo "wasm-opt DESCARTADO (el módulo optimizado no instancia); va el wasm sin optimizar"
          fi
      # El playground se PRUEBA antes de publicar: instancia en V8 y corre un programa real
      # (la clase de rotura que ya pasó — módulo inválido para el navegador — muere aquí).
      - name: Verificar el playground (instancia y corre en V8)
        run: |
          node -e "
          const fs = require('fs');
          WebAssembly.instantiate(fs.readFileSync('playground/raylang.wasm'), {}).then(({ instance }) => {
            const { memory, alloc, run, dealloc, lsp } = instance.exports;
            if (!lsp) { console.error('sin export lsp'); process.exit(1); }
            const enc = new TextEncoder().encode('fn main() { print(1 + 2); }');
            const p = alloc(enc.length);
            new Uint8Array(memory.buffer, p, enc.length).set(enc);
            const packed = run(p, enc.length);
            const ptr = Number(packed >> 32n), len = Number(packed & 0xffffffffn);
            const out = new TextDecoder().decode(new Uint8Array(memory.buffer, ptr, len));
            if (out.trim() !== '3') { console.error('salida inesperada:', out); process.exit(1); }
            console.log('playground OK: 1 + 2 =', out.trim());
          }).catch((e) => { console.error(e); process.exit(1); });
          "
      - name: "Playground: editor real (CodeMirror 6, esbuild)"
        run: |
          cd playground/editor
          npm install --no-audit --no-fund --silent
          npm run --silent build
      - name: Generar el sitio (dogfooding, el propio lenguaje)
        run: cargo run --bin ray -- run site/site.ray . _site
      # El sitio sin playground sería un deploy degradado en silencio: se asevera completo.
      - name: Verificar el sitio completo
        run: |
          test -f _site/index.html
          test -f _site/spec.html
          test -f _site/bench.html
          test -f _site/playground/raylang.wasm
          test -f _site/playground/editor.bundle.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
