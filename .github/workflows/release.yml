# CI de RELEASES de raylang (M44c). Al empujar un tag `vX.Y.Z`, construye los binarios (`ray` + `raylang`)
# para las plataformas soportadas y los sube a la GitHub Release del tag. Cada plataforma se compila de
# forma NATIVA en su propio runner (macOS arm/intel, Linux x86_64/arm64, Windows x86_64/arm64 — M185)
# → `ring`/`rustls` (la excepción cero-deps, con C/asm por arquitectura) compilan sin cross-compilación.
#
# Los assets NO llevan la versión en el nombre (`raylang-<target>.tar.gz`), así el instalador puede usar
# `releases/latest/download/raylang-<target>.tar.gz` sin consultar la API de GitHub.
name: release

# M309: los binarios de release se identifican como la versión limpia (`1.27.12`), nunca
# `+dev.<sha>` (build.rs; el checkout de Actions no trae tags para `git describe`).
on:
  push:
    tags: ["v[0-9]*"]

# Un mismo tag ha disparado DOS runs a 1,5 s (v1.27.23, v1.27.66): el segundo corre en cola, no en
# paralelo (sin cancelar al primero, que está subiendo assets).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RAYLANG_RELEASE_BUILD: "1"

jobs:
  # Crea (o reutiliza, si ya existe) la Release del tag, con notas autogeneradas. Un solo job para no
  # competir entre las patas de la matriz.
  crear-release:
    name: crear la Release del tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Crear la Release (idempotente)
        env:
          GH_TOKEN: ${{ github.token }}
        # Tolera la carrera de dos runs del mismo tag: si el `create` falla con 422 («tag_name
        # already exists») porque el otro run se adelantó, la Release está y se sigue (los assets
        # se suben con --clobber).
        run: |
          exists() { gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; }
          exists && exit 0
          gh release create "${{ github.ref_name }}" \
               --repo "${{ github.repository }}" \
               --title "raylang ${{ github.ref_name }}" \
               --generate-notes \
            || { sleep 5; exists; }

  # M171 (IDEAS §85): el vendor de las dependencias de `ray-runtime` (todas las features + su
  # Cargo.lock), para que `ray toolchain install` deje al equipo listo para `ray build --native`
  # SIN red. Independiente de la plataforma (cargo vendor incluye las deps de todos los targets).
  vendor:
    name: vendor de ray-runtime
    needs: crear-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estable
        run: rustup toolchain install stable --profile minimal
      - name: Vendorizar ray-runtime
        run: sh tools/vendor-runtime.sh ray-runtime-vendor.tar.gz
      # Humo: el tarball debe servir OFFLINE al proyecto que genera `ray build --native`. Se
      # instala como lo haría `ray toolchain install` y se compila un programa sin red.
      - name: Humo del vendor (build nativo offline)
        run: |
          cargo build --release --quiet
          export RAY_TOOLCHAIN_HOME="$RUNNER_TEMP/ray-toolchain"
          ver="$(./target/release/ray version | awk '{print $2}')"
          mkdir -p "$RAY_TOOLCHAIN_HOME/vendor/$ver"
          tar xzf ray-runtime-vendor.tar.gz -C "$RAY_TOOLCHAIN_HOME/vendor/$ver"
          printf 'fn main() { print("vendor ok") }\n' > "$RUNNER_TEMP/hello.ray"
          # HOME vacío simula un equipo limpio (sin ~/.cargo/registry), pero rustup guarda ahí su
          # configuración: sin RUSTUP_HOME/CARGO_HOME explícitos, el proxy `cargo` no sabe qué
          # toolchain usar ("could not choose a version of cargo"; el estreno de v1.5.2).
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$RUNNER_TEMP/home"
          CARGO_NET_OFFLINE=true HOME="$RUNNER_TEMP/home" ./target/release/ray build --native "$RUNNER_TEMP/hello.ray" -o "$RUNNER_TEMP/hello"
          test "$("$RUNNER_TEMP/hello")" = "vendor ok"
      - name: Subir el asset a la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" ray-runtime-vendor.tar.gz \
            --repo "${{ github.repository }}" --clobber

  # M330 D3b: la librería de desarrollo por plataforma móvil (`ray bundle --dev` la descarga
  # cuando `ray` se instaló sin el árbol de fuentes). Cada asset trae `libray_dev.a` (iOS) o
  # `libray_dev.so` (Android) construido por `ray dev-lib` desde este mismo checkout.
  dev-lib:
    name: dev-lib ${{ matrix.target }}
    needs: crear-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,      target: aarch64-apple-ios }
          - { os: macos-15,      target: aarch64-apple-ios-sim }
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: ubuntu-latest, target: x86_64-linux-android }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust estable + target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - name: Construir ray y la librería de desarrollo
        # El NDK del runner de Ubuntu llega en ANDROID_NDK_LATEST_HOME; `ray dev-lib` lo busca en
        # ANDROID_NDK_HOME. (El contexto `env` no está disponible en el `env:` de un job — el intento
        # de mapearlo ahí invalidaba el workflow entero: runs 86–88 «workflow file issue».)
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"; fi
          cargo build --release --quiet
          ./target/release/ray dev-lib --target ${{ matrix.target }} -o "$RUNNER_TEMP/devlib"
          file="libray_dev.a"; case "${{ matrix.target }}" in *android*) file="libray_dev.so";; esac
          mkdir -p pack && cp "$RUNNER_TEMP/devlib" "pack/$file"
          tar czf "ray-dev-lib-${{ matrix.target }}.tar.gz" -C pack "$file"
      - name: Subir el asset a la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "ray-dev-lib-${{ matrix.target }}.tar.gz" \
            --repo "${{ github.repository }}" --clobber

  # Construye y sube un asset por plataforma.
  build:
    name: build ${{ matrix.target }}
    needs: crear-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # macos-13 (el último runner Intel) está RETIRADO — el x86_64 de macOS se compila
          # CRUZADO desde el runner arm (rustup target add ya está en el flujo; ring/rustls
          # compilan cruzado sin fricción con el Xcode del runner).
          # macos-14 se retira el 2 nov 2026 (brownouts desde oct: los jobs de Apple de 1.27.87 y
          # 1.27.88 se cancelaron al instante) → macos-15, pineado para no cambiar de Xcode sin querer.
          - { os: macos-15,         target: x86_64-apple-darwin }
          - { os: macos-15,         target: aarch64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          # M185: Windows ARM64 en su propio runner nativo. Cruzarlo desde el x86_64 obligaría a
          # cuadrar a mano las libs de MSVC y el clang de `ring`; nativo además puede EJECUTAR el
          # binario, así que el humo del instalador vale para las dos arquitecturas.
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # M184/M185: en aarch64-windows `ring` compila su ensamblador con **clang**, no con `cl`. La
      # imagen `windows-11-arm` lo trae (sondeado antes de escribir este job), así que aquí no se
      # instala nada: solo se comprueba, para que un cambio de imagen falle en dos segundos y con
      # el motivo, y no doce minutos después dentro de un build script.
      - name: Comprobar clang (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $clang = (Get-Command clang -ErrorAction SilentlyContinue).Source
          if (-not $clang) { throw "no hay clang en el PATH del runner: ring no puede compilar su ensamblador en aarch64-windows" }
          "clang: $clang"
      - name: Instalar Rust estable + target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - name: Build de release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Empaquetar (tar.gz, unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          tar czf "raylang-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" ray raylang
      - name: Empaquetar (zip, windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/ray.exe", "target/${{ matrix.target }}/release/raylang.exe" `
            -DestinationPath "raylang-${{ matrix.target }}.zip"
      - name: Subir el asset a la Release (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # M185: antes este paso era único para todas las plataformas y adivinaba la extensión
          # (`if -f … tar.gz`); con `shell: bash` y su pipefail eso ya costó una release rota. Cada
          # familia sube ahora lo que sabe que produjo: aquí el tar.gz, en el paso de al lado el zip.
          asset="raylang-${{ matrix.target }}.tar.gz"
          echo "subiendo $asset"
          gh release upload "${{ github.ref_name }}" "$asset" \
            --repo "${{ github.repository }}" --clobber
      # M185: la pata de Windows sube desde pwsh, el mismo shell con el que acaba de empaquetar (el
      # runner ARM64 también trae el bash de Git —sondeado—, pero aquí no aporta nada).
      - name: Subir el asset a la Release (windows)
        if: ${{ contains(matrix.target, 'windows') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = "raylang-${{ matrix.target }}.zip"
          "subiendo $asset"
          gh release upload "${{ github.ref_name }}" $asset --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload fallo con $LASTEXITCODE" }
      # M165: el instalador de Windows se prueba contra el zip RECIÉN subido — una release no puede
      # publicar un instalador roto (el bug que el `install.sh` de unix nunca tuvo: sí se probaba).
      - name: Humo del instalador (install.ps1 contra este tag)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        env:
          RAYLANG_VERSION: ${{ github.ref_name }}
          RAYLANG_BIN_DIR: ${{ runner.temp }}\raylang-bin
        run: |
          ./install.ps1
          $installed = Join-Path $env:RAYLANG_BIN_DIR "ray.exe"
          $v = & $installed version
          if ($LASTEXITCODE -ne 0) { throw "el ray.exe instalado no arranca" }
          $want = $env:RAYLANG_VERSION.TrimStart("v")
          if ("$v" -notmatch [regex]::Escape($want)) { throw "instaló '$v', se esperaba $want" }
