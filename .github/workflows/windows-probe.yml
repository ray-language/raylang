# Sondas de red en Windows (docs/windows.md 3.6): separan las hipótesis del cuelgue de los
# clientes TCP hacia fuera que destapó el censo. Informativo; se lanza a mano o en ramas `probe/**`.
name: Sondas Windows

on:
  workflow_dispatch:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    name: sondas TCP (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-win-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release --bin ray
      - name: IPv6 del runner
        shell: pwsh
        continue-on-error: true
        run: |
          Get-NetIPAddress -AddressFamily IPv6 | Select-Object IPAddress, PrefixOrigin | Format-Table
          Resolve-DnsName example.com | Select-Object Name, Type, IPAddress | Format-Table
      - name: P1 connect hacia fuera (nombre vs literal IPv4)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 5
        run: ./target/release/ray.exe run tools/windows_probe/p1_connect.ray
