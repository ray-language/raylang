[package]
name = "raylang"
version = "1.0.0"
edition = "2024"
description = "raylang — un lenguaje de programación estáticamente tipado, orientado a expresiones, con genéricos, traits, concurrencia por actores y compilador auto-alojado. Escrito en Rust (VM + GC), casi cero dependencias."
authors = ["Roberto Ayala <dev@rayala.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/roberto-ayala/raylang"
readme = "README.md"
keywords = ["language", "compiler", "vm", "interpreter", "programming-language"]
categories = ["compilers", "development-tools"]

# M44a-3: `cdylib` para que el build wasm exporte `alloc`/`run`/`dealloc` (el playground web); `rlib` para
# que los binarios (`ray`/`raylang`) y los tests sigan enlazando contra la librería. En nativo se compilan
# ambos (el cdylib es un artefacto extra e inofensivo).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# M35b: el **intérprete de árbol** vive tras esta feature (activa por defecto). El motor de
# producto es la VM (M35a); el intérprete existe como **oráculo de desarrollo** (validación
# cruzada) y como `--interp`. Una *release* mínima puede excluirlo con `--no-default-features`,
# quedándose solo con la VM. El modelo de valores (`runtime`) se compila siempre.
default = ["interp"]
interp = []

# M44a — TLS/cripto SOLO para targets NO-wasm. `ring`/`rustls` no compilan a `wasm32-unknown-unknown`
# (asm/C específico de arquitectura), y el **playground web** (M44) embarca solo el lenguaje NÚCLEO
# (sin red/TLS/cripto). Al declararlas como dependencias condicionadas por target, el build nativo queda
# IDÉNTICO y el de wasm simplemente no las trae. El uso en `builtins.rs` va tras `cfg(not(wasm32))`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# M19.4 — TLS. ÚNICA excepción a la invariante cero-deps (decisión §28.4): la criptografía no se
# implementa a mano. `rustls` con el proveedor `ring` (Rust+C portable, sin cmake/OpenSSL) + las raíces
# de confianza de Mozilla (`webpki-roots`) para verificar certificados de servidor.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
# Para leer certificados PEM (SSL_CERT_FILE): la feature `std` de los tipos de rustls (ya en el árbol).
rustls-pki-types = { version = "1", features = ["std"] }
# M43 — cripto de PRODUCCIÓN. `ring` ya está en el árbol (lo enlaza rustls); declararlo directo resuelve a
# la MISMA copia (0.17.x) → cero crate nuevo, dentro de la excepción "TLS/ring" ya sancionada. Da las
# primitivas de tiempo constante y auditadas (SHA/HMAC/Ed25519/AEAD) que raylang puro no puede garantizar.
# Las implementaciones en raylang (`examples/web/*.ray`) se conservan como DEMOSTRACIÓN DEL LENGUAJE.
ring = "0.17"
