# Workspace (P2.b, jul 2026): el binario `ray` + el crate `ray-runtime` (runtime compartido con crates de
# producción tras features — crypto/tls/sqlite). Ver docs/transpilador-nativo.md §4. `ray-runtime` lo
# consumen la VM (aquí) y el binario TRANSPILADO a Rust (`ray build --native`), con el MISMO código.
[workspace]
members = ["crates/ray-runtime"]

[package]
name = "raylang"
version = "1.5.0"
edition = "2024"
description = "raylang — un lenguaje de programación estáticamente tipado, orientado a expresiones, con genéricos, traits, concurrencia por actores y compilador auto-alojado. Escrito en Rust (VM + GC), casi cero dependencias."
authors = ["Roberto Ayala <dev@rayala.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ray-language/raylang"
readme = "README.md"
keywords = ["language", "compiler", "vm", "interpreter", "programming-language"]
categories = ["compilers", "development-tools"]

# M44a-3: `cdylib` para que el build wasm exporte `alloc`/`run`/`dealloc` (el playground web); `rlib` para
# que los binarios (`ray`/`raylang`) y los tests sigan enlazando contra la librería. En nativo se compilan
# ambos (el cdylib es un artefacto extra e inofensivo).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# M35b: el **intérprete de árbol** vive tras esta feature (activa por defecto). El motor de
# producto es la VM (M35a); el intérprete existe como **oráculo de desarrollo** (validación
# cruzada) y como `--interp`. Una *release* mínima puede excluirlo con `--no-default-features`,
# quedándose solo con la VM. El modelo de valores (`runtime`) se compila siempre.
default = ["interp", "sqlite", "net-tls", "ffi", "regex", "watch", "unicode", "audio", "ui"]
interp = []
# M89 (IDEAS §47): SQLite embebido tras una feature (activa por defecto → el binario normal es
# idéntico). Un build "slim" para contenedores/embedding la excluye (--no-default-features
# --features interp): sin el C de SQLite dentro, menos peso y menos superficie de ataque. Un
# programa que use db/sqlite contra un binario slim recibe un Err claro en connect (errores como
# valores; el checker acepta el programa — la tabla BUILTINS se registra siempre).
sqlite = ["dep:rusqlite"]
# M115.4: watch de filesystem por eventos de kernel (crate `notify` vía ray-runtime — FSEvents en
# macOS, inotify en Linux). Activa por defecto; el build slim la excluye y `fs.watch` devuelve un
# Err claro (errores como valores, como sqlite).
watch = ["ray-runtime/watch"]
# M145: salida de audio PCM (std/audio) — backends a mano en ray-runtime (cero crates).
audio = ["ray-runtime/audio"]
# M146: ventana + webview (std/ui, IDEAS §80 F1) — AppKit/WKWebView por objc a mano en
# ray-runtime; RAY_UI_BACKEND=headless para tests/CI. Slim la excluye (Err claro, como sqlite).
ui = ["ray-runtime/ui"]
# M89.2: TLS + cripto de producción (rustls/ring) tras una feature (activa por defecto). El build
# slim la excluye: sin https/wss ni sha/hmac/ed25519/chacha de ring (los builtins responden con un
# error claro), y `ray publish --sign`/verificación de firmas del registro no disponibles (el CLI
# lo dice explícito — nunca una verificación que "pasa" en silencio). El hash de integridad del
# lockfile NO depende de esto (src/sha256.rs es Rust puro).
# La cripto (SHA/HMAC/Ed25519/ChaCha) vive ahora en `ray-runtime` (feature `crypto`) → mismo código que el
# binario transpilado. `ring` ya no se declara directo aquí: llega vía `ray-runtime/crypto` (+ transitivo de
# rustls). El *stub* de slim/wasm sigue en `builtins.rs` (rama `not(net-tls)`).
# (M100: `ray-runtime` dejó de ser opcional — el primitivo de procesos vive ahí y es del núcleo;
# sin features extra el crate no arrastra ninguna dependencia → el build slim queda igual.)
net-tls = ["ray-runtime/crypto", "ray-runtime/x509", "dep:rustls", "dep:webpki-roots", "dep:rustls-pki-types"]
# M89.3: la carga de librerías nativas (extern/FFI, libloading) tras una feature (activa por
# defecto). El slim sin ella tiene la propiedad "no puede cargar código nativo" (contenedores
# endurecidos); un `extern fn` chequea igual y su llamada da un error de ejecución claro.
ffi = ["dep:libloading"]
# R7 (perf, jul 2026): el motor de `std/regex` en la VM. Con la feature activa, el compilador de
# bytecode intercepta las 7 funciones internas `run_*` de std/regex y las despacha al crate `regex`
# vía `ray-runtime` — el MISMO borde que usa el binario nativo desde R5 (misma traducción de
# dialecto, misma caché por hilo → misma salida byte a byte). El parseo/validación del patrón y sus
# errores siguen siendo los de la librería raylang. El build slim la excluye y la Pike VM raylang
# se ejecuta tal cual (fallback = la implementación real, sin stubs); el intérprete (`--interp`)
# NUNCA intercepta: conserva la Pike VM como oráculo continuo del dialecto.
regex = ["ray-runtime/regex"]
# M131: normalización Unicode de `std/text` (NFC/NFD/NFKC/NFKD) vía `ray-runtime` (crate
# unicode-normalization). Activa por defecto; el build slim la excluye y el builtin devuelve un
# error claro (como sqlite/net-tls).
unicode = ["ray-runtime/unicode"]

# M44a — TLS/cripto SOLO para targets NO-wasm. `ring`/`rustls` no compilan a `wasm32-unknown-unknown`
# (asm/C específico de arquitectura), y el **playground web** (M44) embarca solo el lenguaje NÚCLEO
# (sin red/TLS/cripto). Al declararlas como dependencias condicionadas por target, el build nativo queda
# IDÉNTICO y el de wasm simplemente no las trae. El uso en `builtins.rs` va tras `cfg(not(wasm32))`.
[dependencies]
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# P0.1 (perf, jul 2026): hasher aHash para el almacén interno de `Map`. 2–5× más rápido que el
# SipHash de std sobre claves cortas (int/string), conservando resistencia a hash-flooding (semilla
# aleatoria por proceso vía runtime-rng). Ya estaba en el árbol como transitiva (rustls/ring) → cero
# crate nuevo. El orden de iteración nunca se observa (keys()/values() ordenan) → sin regresión de
# determinismo (std ya era aleatorio). NO en wasm (su runtime-rng exige getrandom, que no compila a
# wasm32-unknown-unknown sin glue JS): el playground vuelve al SipHash de std (M44a — lo que usaba
# antes de P0.1; el rendimiento del Map no es crítico ahí).
ahash = "0.8"
# P2.b — el runtime compartido con crates de producción (crypto/tls/sqlite tras features). M100 lo hace
# NO-opcional: el primitivo de procesos (`process`, solo std+libc) es del núcleo, y sin más features el
# crate no arrastra ninguna dependencia externa (el build slim queda igual). No en wasm (ring no compila
# a wasm32 y `process` es unix; el playground embarca solo el núcleo — el stub wasm vive en builtins.rs).
ray-runtime = { path = "crates/ray-runtime", default-features = false, features = ["process"] }
# P0.4 (perf, jul 2026): allocador global mimalloc. El malloc del sistema (macOS libmalloc en
# particular) es lento para el CHURN de objetos pequeños del intérprete —`split`/`to_string`/arrays
# alocan millones de `String` pequeños (en `wordcount`, `split` es el 82% del tiempo, todo malloc)—.
# mimalloc es 2–4× más rápido en ese patrón; acelera todos los benchmarks con CERO cambio semántico
# (oráculo intacto). No en wasm (no hay allocador de sistema que reemplazar y necesita C).
mimalloc = { version = "0.1", default-features = false }
# M19.4 — TLS. ÚNICA excepción a la invariante cero-deps (decisión §28.4): la criptografía no se
# implementa a mano. `rustls` con el proveedor `ring` (Rust+C portable, sin cmake/OpenSSL) + las raíces
# de confianza de Mozilla (`webpki-roots`) para verificar certificados de servidor.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
# Para leer certificados PEM (SSL_CERT_FILE): la feature `std` de los tipos de rustls (ya en el árbol).
rustls-pki-types = { version = "1", features = ["std"], optional = true }
# M43 — cripto de PRODUCCIÓN (SHA/HMAC/Ed25519/AEAD): se movió a `ray-runtime` (feature `crypto`) en P2.b
# → mismo código que el binario transpilado. `ring` ya no se declara directo aquí (llega vía ray-runtime +
# transitivo de rustls). Las implementaciones en raylang (`examples/web/*.ray`) se conservan como DEMO.
# M53.3 — SQLite de PRODUCCIÓN. Igual que `ring` (M43): territorio donde envolver la librería C a mano
# (FFI + dobles punteros + lifetimes de statements) es peor ingeniería que delegar en el binding maduro.
# `bundled` compila SQLite dentro del binario → cero dependencia del sistema, versión determinista.
# El wrapper de usuario vive en `packages/db/sqlite.ray` sobre los primitivos `__sqlite_*`.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# Endurecimiento FFI (jul 2026) — la CARGA de librerías pasa de dlopen/dlsym a mano a `libloading`
# (puro Rust sobre las APIs de plataforma): arregla Windows (dlopen no existe en MSVC → el binario no
# linkeaba) y da los mensajes de error reales del loader. La LLAMADA sigue con el catálogo de moldes
# propio (libffi queda anotado para un FFI v2 con consumidor real; IDEAS §14).
libloading = { version = "0.8", optional = true }

# Perfil release: `strip` reduce el binario (~6.5 MB → menos símbolos que cargar/pagear en el
# arranque). Los backtraces de release ya no eran simbólicos (sin debug info); el ICE banner y
# los diagnósticos no dependen de símbolos.
[profile.release]
strip = "symbols"
