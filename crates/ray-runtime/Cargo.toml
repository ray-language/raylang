# `ray-runtime` — el runtime compartido de raylang con dependencias de crates externos (P2.b, jul 2026).
#
# Motivo (ver docs/transpilador-nativo.md §4): las funciones que envuelven crates de producción
# (ring/rustls/rusqlite) las necesitan DOS consumidores — la VM (el binario `ray`) y el binario
# TRANSPILADO a Rust (`ray build --native`). Extraerlas a este crate compartido da PARIDAD por
# construcción (ambos llaman al MISMO código) y una única fuente de verdad de versiones.
#
# Cada subsistema-con-crate va tras una FEATURE (bajo demanda): un consumidor solo activa lo que usa.
# Sin features activas, el crate compila sin ninguna dependencia externa (stubs).
[package]
name = "ray-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Runtime compartido de raylang: envoltorios de crates de producción (crypto/tls/sqlite) tras features, para la VM y el binario transpilado."

[features]
default = []
# Cripto de PRODUCCIÓN (ring): SHA/HMAC/Ed25519/ChaCha20-Poly1305/CSPRNG/HKDF. Determinista → oráculo
# VM↔nativo. M114 añade el ACUERDO DE CLAVES (X25519) con `x25519-dalek`: ring trae el algoritmo pero su
# API solo da claves EFÍMERAS (`EphemeralPrivateKey::generate(alg, rng)`, sin constructor desde octetos,
# `SecureRandom` sellado) → ni clave persistente ni determinismo, que es justo lo que este proyecto exige.
crypto = ["dep:ring", "dep:x25519-dalek", "dep:subtle"]
# TLS de PRODUCCIÓN (rustls). El binario transpilado usa hilos de SO reales → I/O TLS BLOQUEANTE
# (StreamOwned), a diferencia de la VM (no-bloqueante + fibras). ring provee el proveedor de rustls.
# M124: `tls` arrastra `x509` — todo consumidor de TLS puede inspeccionar el certificado del peer.
tls = ["dep:rustls", "dep:webpki-roots", "dep:rustls-pki-types", "x509"]
# M124 — resumen del certificado X.509 del peer (`net.tls_peer_cert`): subject/issuer/validez/SAN
# desde el DER que rustls ya tiene en mano. `x509-parser` (rusticata) en vez de un walk DER a mano:
# parsear nombres X.500 + GeneralizedTime + GeneralNames es exactamente la clase de código
# seguridad-adyacente que no se escribe artesanal. Feature aparte para que la VM (que trae su
# propio rustls vía `net-tls` del host) la active sin arrastrar el TLS de este crate.
x509 = ["dep:x509-parser"]
# SQLite embebido de PRODUCCIÓN (rusqlite, `bundled` = el C de SQLite dentro del binario → sin dependencia
# del sistema, versión determinista). Resultados deterministas → oráculo por byte-identidad VM↔nativo.
sqlite = ["dep:rusqlite"]
# M115.4 — watch de filesystem por EVENTOS DE KERNEL (crate `notify`: FSEvents en macOS, inotify en
# Linux; la recursividad sobre árboles resuelta — kqueue crudo exigiría un fd por archivo). Los
# eventos llegan en hilos del propio notify y se puentean a las fibras con un SELF-PIPE (el truco de
# signals M88.1): la fibra aparca por readiness del extremo de lectura.
watch = ["dep:notify"]
# N1 (bench políglota, jul 2026): mimalloc como allocador del binario TRANSPILADO. El binario `ray` ya lo
# usa (P0.4); el transpilado caía al malloc del sistema (lento en churn de strings pequeños en macOS).
# Medido: wordcount/logparse −40%, jsonserialize −18%. Activada POR DEFECTO por `ray build --native`;
# escape: `--without mimalloc` (vuelve al malloc del sistema y, sin otros subsistemas, al rustc pelado).
mimalloc = ["dep:mimalloc"]
# N2 (bench políglota, jul 2026): aHash como hasher de los `Map` del binario TRANSPILADO — el mismo que
# usa la VM desde P0.1 (paridad de motor de hashing; el HashMap std con SipHash es lento en claves string).
# Medido: wordcount −8.5% adicional sobre mimalloc. Como `mimalloc`, no se detecta por uso: POR DEFECTO,
# escape `--without ahash`. La resistencia a hash-flooding se conserva (RandomState con RNG de runtime).
ahash = ["dep:ahash"]
# F1 (arco de concurrencia nativa, jul 2026 — docs/diseno-concurrencia-nativa.md): scheduler M:N de
# FIBRAS para el binario transpilado (corrutinas de pila propia con corosensei + reactor kqueue/epoll),
# sustituto del hilo-por-conexión (medido: 1002 hilos / ~265 KB/conexión a -c 1000, contra 13 hilos /
# 23 KB del mismo modelo en la VM). corosensei y no `asm!` propio: el unsafe de cambio de contexto es
# la clase de código donde un error es corrupción de memoria silenciosa, no una excepción.
fibers = ["dep:corosensei"]
# M100 (IDEAS §53.8): ejecución de procesos del SO. SIN dependencias externas (std + libc a mano):
# la feature no gatea un crate sino la COMPILACIÓN del módulo, y en el transpilado fuerza la vía
# Cargo (como `fibers`). El binario `ray` la activa siempre (el primitivo `__run` es del núcleo).
process = []
# R5 (bench regex, jul 2026): motor de regex ACELERADO del binario transpilado (crate `regex`,
# la liga de Rust: ~27 ms donde la Pike VM transpilada tarda ~580 ms). Detectada POR USO (import
# std/regex ejecutado), como crypto/tls/sqlite. `--without regex` NO stubbea: el fallback es la
# Pike VM de std/regex transpilada tal cual (la implementación real). El parseo/validación del
# patrón y sus errores siguen siendo los de std/regex (paridad byte-idéntica con la VM).
regex = ["dep:regex"]

[dependencies]
# M43 — ring 0.17: primitivas de tiempo constante y auditadas. Misma versión que la que usaba el binario
# `ray` (era transitiva vía rustls); aquí se declara directa para el módulo crypto.
ring = { version = "0.17", optional = true }
# M114 — x25519-dalek 3.0: acuerdo de claves X25519 en tiempo constante, con clave privada CONSTRUIBLE
# DESDE OCTETOS (`StaticSecret::from([u8;32])`) → semilla persistible y determinista, la forma que ya usa
# Ed25519 aquí. `static_secrets` sin `getrandom`: la aleatoriedad la sigue poniendo el CSPRNG de ring.
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets"], optional = true }
# M114 — subtle 2.6: la comparación en tiempo constante (`constant_time_eq`). Ya venía en el árbol como
# transitiva de curve25519-dalek; se declara directa porque la usamos. Su razón de ser es exactamente que
# el compilador NO pueda optimizar el bucle a un cortocircuito (`ring` deprecó su equivalente público).
subtle = { version = "2.6", default-features = false, optional = true }
# M19.4 — rustls (proveedor ring, sin OpenSSL): TLS puro Rust+C portable. Mismas versiones/features que
# usaba el binario `ray` → mismo comportamiento. Las raíces de Mozilla (webpki-roots) verifican certificados.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
# M124 — parser X.509 (rusticata) para `net.tls_peer_cert`: subject/issuer/validez/SAN del DER.
x509-parser = { version = "0.17", optional = true }
webpki-roots = { version = "0.26", optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
# M53.3 — rusqlite 0.32 con `bundled`: compila SQLite dentro del binario. Misma versión que el binario `ray`.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# M115.4 — watcher de fs multiplataforma (FSEvents/inotify/kqueue detrás de un API único).
notify = { version = "8", optional = true }
# N1 — mimalloc 0.1: misma versión/crate que usa el binario `ray` (src/lib.rs) → mismo allocador en ambos.
mimalloc = { version = "0.1", optional = true }
# N2 — ahash 0.8: misma versión que usa el binario `ray` (P0.1, `MapStore` de la VM) → mismo hasher en ambos.
ahash = { version = "0.8", optional = true }
# R5 — regex 1.x: el motor de producción de Rust (NFA/DFA híbrido, literal optimizations).
regex = { version = "1", optional = true }
# F1 — corosensei 0.2: corrutinas de pila propia (aarch64+x86_64, macOS/Linux/Windows), pila mmap con
# página de guarda. El cambio de contexto en asm auditado de un solo crate, sin arrastre transitivo.
corosensei = { version = "0.2", optional = true }
