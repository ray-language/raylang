<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pad</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #1f2430; color: #e6e9ef; }
  textarea { width: 100%; height: 100%; box-sizing: border-box; border: 0; outline: 0; resize: none;
    padding: 16px; background: transparent; color: inherit; font: 15px/1.5 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<textarea id="text" spellcheck="false" autofocus placeholder="Write something…"></textarea>
<script>
  const text = document.getElementById('text');
  // The program pushes a document with eval_js("setText(...)").
  window.setText = (value) => { text.value = value; };
  // Every edit goes to the program, which tracks the unsaved state.
  text.addEventListener('input', () => window.ray.request({ op: 'changed', text: text.value }));
  // Right click: the program shows a native context menu.
  document.addEventListener('contextmenu', (e) => { e.preventDefault(); window.ray.send('context'); });
</script>
</body>
</html>
