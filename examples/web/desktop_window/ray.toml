[package]
name = "desktop-window-demo"
version = "0.1.0"
entry = "main.ray"

# El framework vive en el paquete `web` (que a su vez usa `net`) → dependencias por ruta.
[dependencies]
web = "path:../../../packages/web"
net = "path:../../../packages/net"

# M147: los assets viajan DENTRO del binario nativo (y en dev se leen en vivo del disco).
[native]
embed = ["assets"]
