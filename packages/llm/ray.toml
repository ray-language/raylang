# Manifiesto del paquete-librería `llm`. Los imports `llm/…` se resuelven contra el directorio
# padre (deps::dependency_roots_for); `entry` es la cara publicable que valida y carga
# `ray registry publish`.
[package]
name = "llm"
version = "0.1.0"
license = "Apache-2.0"
description = "Talk to language models from raylang: one conversation model over the Anthropic Messages API and the OpenAI Chat Completions dialect (OpenAI, Ollama, OpenRouter, Groq, Mistral, Gemini…), with tool calls, streaming, retries and prompt caching"
keywords = ["llm", "ai", "anthropic", "claude", "openai", "ollama", "openrouter", "chat", "streaming", "tools", "agent", "sse"]
entry = "llm.ray"

# El transporte es el cliente HTTP con streaming y el decodificador SSE de `net`.
[dependencies]
net = "path:../net"
