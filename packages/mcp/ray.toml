# Manifiesto del paquete-librería `mcp`. Los imports `mcp/…` se resuelven contra el directorio
# padre (deps::dependency_roots_for); `entry` es la cara publicable que valida y carga
# `ray registry publish`.
[package]
name = "mcp"
version = "0.1.0"
license = "Apache-2.0"
description = "Model Context Protocol for raylang: a client over stdio and Streamable HTTP (tools, resources, server instructions), with one session actor per server"
keywords = ["mcp", "model-context-protocol", "llm", "agent", "tools", "json-rpc", "stdio", "sse", "client"]
entry = "mcp.ray"

# El transporte HTTP usa el cliente con streaming y el decodificador SSE de `net`.
[dependencies]
net = "path:../net"
