# Manifiesto del paquete-librería `web` (sin entry: los imports `web/…` y los de sus
# hermanas (`net/…`) se resuelven contra el directorio padre — deps::dependency_roots_for).
[package]
name = "web"
version = "0.4.3"
license = "Apache-2.0"
description = "The Express-style web application framework on top of net/webserver: routing, middleware, templates, sessions, streaming and state"
keywords = ["web", "framework", "express", "routing", "middleware", "server", "app", "backend", "templates", "sessions", "streaming", "sse", "desktop", "mobile"]
entry = "framework.ray"

[dependencies]
net = "path:../net"
