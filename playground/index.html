<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raylang · playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 20 200 184'%3E%3Cpath d='M100 50 C108 49 113 53 115 60 C150 66 175 84 191 116 C166 127 141 137 119 150 C111 154 105 159 100 165 C95 159 89 154 81 150 C59 137 34 127 9 116 C25 84 50 66 85 60 C87 53 92 49 100 50 Z' fill='%232B7CE0'/%3E%3Cpath d='M93 55 C90 45 88 38 87 30' stroke='%232B7CE0' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3Cpath d='M107 55 C110 45 112 38 113 30' stroke='%232B7CE0' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
  /* Fuentes de marca embebidas (SIL OFL 1.1; ver fonts/README.md). Space Grotesk (UI/títulos) es variable
     300–700; JetBrains Mono (editor de código) es regular. `swap` para no bloquear el render. */
  @font-face { font-family:"Space Grotesk"; src:url("fonts/space-grotesk.woff2") format("woff2"); font-weight:300 700; font-display:swap; }
  @font-face { font-family:"JetBrains Mono"; src:url("fonts/jetbrains-mono.woff2") format("woff2"); font-weight:400; font-display:swap; }
  /* Colores de marca raylang: azul primario #2B7CE0, navy #0B1F33, acentos. */
  :root { color-scheme: dark; --bg:#0b1622; --panel:#0e1c2e; --border:#1e3454; --fg:#e6edf3; --accent:#2B7CE0; --muted:#8fa6c4; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--border); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .tag { color:var(--muted); font-size:12px; }
  header .sp { flex:1; }
  button { background:var(--accent); color:#04122a; border:0; border-radius:6px; padding:7px 16px; font-weight:600; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }
  main { display:grid; grid-template-columns:212px 1fr 1fr; gap:1px; background:var(--border); height:calc(100vh - 54px); }
  /* En móvil: el explorador se mantiene a la izquierda (más angosto) y el editor/salida se apilan. */
  @media (max-width:820px){ main{ grid-template-columns:128px 1fr; grid-template-rows:1fr 1fr; }
    .sidebar{ grid-row:1 / span 2; }
    .file{ padding:6px 8px 6px 12px; font-size:12px; } .file span{ overflow:hidden; text-overflow:ellipsis; } }
  .pane { background:var(--panel); display:flex; flex-direction:column; min-width:0; min-height:0; }
  /* Panel lateral de "archivos" (tipo explorador de un editor). */
  .sidebar { background:#0a131f; display:flex; flex-direction:column; min-height:0; overflow:auto; padding:6px 0; }
  .tree-header { padding:8px 14px 6px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    display:flex; align-items:center; gap:7px; }
  .files { list-style:none; margin:0; padding:0; }
  .file { display:flex; align-items:center; gap:8px; padding:5px 14px 5px 18px; font-size:13px; cursor:pointer;
    color:var(--fg); border-left:2px solid transparent; white-space:nowrap;
    font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace; }
  .file svg { flex:none; opacity:.9; }
  .file:hover { background:rgba(43,124,224,.10); }
  .file.active { background:rgba(43,124,224,.18); border-left-color:var(--accent); color:#fff; }
  .pane .label { padding:6px 14px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.04em; }
  /* Editor con resaltado por OVERLAY: un <textarea> transparente (edición nativa: caret, selección) encima
     de un <pre> coloreado; se sincroniza el scroll. Ambas capas comparten métricas EXACTAS (mono → alinea). */
  .editor { position:relative; flex:1; min-height:0; overflow:hidden; }
  .editor > pre, .editor > textarea {
    position:absolute; inset:0; margin:0; border:0; padding:14px;
    font:13px/1.5 "JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
    tab-size:4; white-space:pre; overflow-wrap:normal; }
  .editor > pre { color:#c9d1d9; background:transparent; pointer-events:none; overflow:hidden; }
  .editor > textarea { color:transparent; background:transparent; caret-color:var(--fg);
    resize:none; outline:none; overflow:auto; }
  /* Salida */
  #out { flex:1; margin:0; padding:14px; color:#c9d1d9; overflow:auto; white-space:pre-wrap;
    font:13px/1.5 "JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace; }
  /* Tokens (tema oscuro sobre el navy de marca). */
  .tok-kw{color:#c9a3ff} .tok-ty{color:#5bacf7} .tok-str{color:#7ee787} .tok-num{color:#f0a868}
  .tok-com{color:#6b7f99;font-style:italic} .tok-fn{color:#79c0ff} .tok-lit{color:#f0a868} .tok-ann{color:#e3b341}
  .tok-idelim{color:#8fa6c4}  /* delimitadores ${ } de interpolación */
  .status { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <svg width="26" height="24" viewBox="0 20 200 184" aria-hidden="true" style="flex:none">
    <path d="M100 50 C108 49 113 53 115 60 C150 66 175 84 191 116 C166 127 141 137 119 150 C111 154 105 159 100 165 C95 159 89 154 81 150 C59 137 34 127 9 116 C25 84 50 66 85 60 C87 53 92 49 100 50 Z" fill="#2B7CE0"/>
    <path d="M93 55 C90 45 88 38 87 30" stroke="#2B7CE0" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M107 55 C110 45 112 38 113 30" stroke="#2B7CE0" stroke-width="7" stroke-linecap="round" fill="none"/>
  </svg>
  <h1>raylang <span class="tag">· playground</span></h1>
  <span class="sp"></span>
  <span class="status" id="status">cargando…</span>
  <button id="run" disabled>▶ Ejecutar (⌘/Ctrl+Enter)</button>
</header>
<main>
  <aside class="sidebar">
    <div class="tree-header">ejemplos</div>
    <ul class="files" id="files"></ul>
  </aside>
  <div class="pane">
    <div class="label" id="filelabel">fib.ray</div>
    <div class="editor">
      <pre aria-hidden="true"><code id="hl"></code></pre>
      <textarea id="src" spellcheck="false" wrap="off" autocapitalize="off" autocorrect="off" autocomplete="off"></textarea>
    </div>
  </div>
  <div class="pane">
    <div class="label">salida</div>
    <pre id="out"></pre>
  </div>
</main>

<script type="module">
// M44a-3: glue del playground. ABI cruda contra el .wasm de raylang (sin wasm-bindgen): alloc → escribir
// el fuente → run(ptr,len) → u64 empaquetado (ptr<<32|len) → leer la salida → dealloc.
const EJEMPLOS = {
  "fib": `fn fib(n: int) -> int {
  if (n < 2) { n } else { fib(n - 1) + fib(n - 2) }
}
fn main() -> int {
  for i in range(0, 12) {
    print("fib(\${i}) = \${fib(i)}");     // for + interpolación
  }
  0
}`,
  "genéricos": `fn id<T>(x: T) -> T { x }        // genérica: funciona con cualquier tipo

fn main() -> int {
  print(id("raylang es genérico"));
  // pipeline (|>) + iteradores perezosos: eleva al cuadrado, filtra impares, suma.
  let suma = [1, 2, 3, 4, 5]
    |> map(fn(x: int) -> int { x * x })
    |> filter(fn(x: int) -> bool { x % 2 == 1 })
    |> fold(0, fn(a: int, b: int) -> int { a + b });
  print("suma de cuadrados impares: \${suma}");
  0
}`,
  "enums": `enum Figura { Circulo(float), Rect(float, float) }

fn area(f: Figura) -> float {
  match (f) {                            // match es exhaustivo
    Figura.Circulo(r) => pi() * r * r,  // pi() es un builtin
    Figura.Rect(w, h) => w * h,
  }
}
fn main() -> int {
  print("círculo r=2: \${area(Figura.Circulo(2.0))}");
  print("rect 3x4:    \${area(Figura.Rect(3.0, 4.0))}");
  0
}`,
  "traits": `trait Saludar { fn hola(self) -> string; }
struct Persona { nombre: string }
impl Saludar for Persona {
  fn hola(self) -> string { "hola, \${self.nombre}!" }   // interpolación de strings
}
fn main() -> int {
  let p = Persona { nombre: "raylang" };
  print(p.hola());
  0
}`,
  "errores": `// Sin null: la ausencia y el fallo son VALORES (Option / Result), no excepciones.
fn dividir(a: int, b: int) -> Result<int, string> {
  if (b == 0) { Result.Err("división por cero") } else { Result.Ok(a / b) }
}
fn calcular() -> Result<int, string> {
  let x = dividir(100, 5)?;         // ? desempaqueta el Ok, o retorna el Err
  let y = dividir(x, 4)?;
  Result.Ok(x + y)
}
fn main() -> int {
  match (calcular()) {
    Result.Ok(v)  => print("ok: \${v}"),
    Result.Err(e) => print("error: \${e}"),
  }
  let nums = [10, 20, 30];
  match (nums.position(20)) {        // position -> Option<int>
    Option.Some(i) => print("20 está en el índice \${i}"),
    Option.None    => print("no está"),
  }
  0
}`,
  "iteradores": `fn main() -> int {
  // Pipeline PEREZOSO: no materializa nada hasta collect; take() corta pronto.
  let cuadrados = range(1, 100)
    .map(fn(x: int) -> int { x * x })
    .filter(fn(x: int) -> bool { x % 2 == 0 })
    .take(4)
    .collect();
  print(cuadrados);                  // [4, 16, 36, 64]

  // enumerate + patrón de tupla en el for
  for (i, fruta) in ["manzana", "pera", "uva"].iter().enumerate() {
    print("\${i}: \${fruta}");
  }
  0
}`,
  "dyn": `trait Forma { fn area(self) -> float; fn nombre(self) -> string; }
struct Circulo  { r: float }
struct Cuadrado { lado: float }
impl Forma for Circulo {
  fn area(self) -> float { pi() * self.r * self.r }
  fn nombre(self) -> string { "círculo" }
}
impl Forma for Cuadrado {
  fn area(self) -> float { self.lado * self.lado }
  fn nombre(self) -> string { "cuadrado" }
}
fn main() -> int {
  // Colección HETEROGÉNEA vía trait objects → despacho dinámico.
  let formas: [dyn Forma] = [Circulo { r: 2.0 }, Cuadrado { lado: 3.0 }];
  for f in formas {
    print("\${f.nombre()}: \${f.area()}");
  }
  0
}`,
  "concurrencia": `fn main() -> int {
  // Modelo de actores: fibras que se comunican por canales (sin estado compartido).
  let ch: Channel<int> = channel();
  spawn(fn() {
    for i in range(1, 6) { send(ch, i * i); }
    close(ch);
  });
  var total = 0;
  var seguir = true;
  while (seguir) {
    match (recv(ch)) {             // recv -> Option<T>; None al cerrar
      Option.Some(v) => { print("recibí \${v}"); total = total + v; },
      Option.None    => { seguir = false; },
    }
  }
  print("total: \${total}");
  0
}`,
};

const $ = (id) => document.getElementById(id);
const srcEl = $("src"), outEl = $("out"), runEl = $("run"), statusEl = $("status"), hlEl = $("hl"),
      filesEl = $("files"), fileLabelEl = $("filelabel");

// --- Resaltado de sintaxis de raylang (a mano, cero deps) ---
// Un scanner tokeniza el fuente (robusto ante comentarios/strings) y emite <span> por token. Las
// palabras clave y tipos primitivos son los del lexer real (src/token.rs); un identificador con mayúscula
// inicial se trata como tipo/enum, y uno seguido de '(' como función.
const KW  = new Set("fn let var const if else while for in match return struct enum trait impl import from as pub dyn extern spawn".split(" "));
const TY  = new Set("int float bool string char bytes ptr unit".split(" "));
const LIT = new Set("true false".split(" "));
function esc(s){ return s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c])); }
function span(cls, s){ return `<span class="${cls}">${esc(s)}</span>`; }
// Una cadena "..." con interpolación: las partes literales van en verde y cada ${expr} se resalta como
// CÓDIGO embebido (recursivo, vía highlight). Los delimitadores ${ } se marcan aparte. `\` escapa (incl.
// `\${` como un `${` literal, que así NO abre interpolación). Devuelve [html, índice tras la comilla].
function hlString(code, i){
  const n = code.length; let j = i + 1, out = "", lit = code[i];
  while (j < n) {
    const c = code[j];
    if (c === "\\") { lit += c + (code[j+1] ?? ""); j += 2; continue; }   // escape: 2 caracteres
    if (c === '"') { lit += c; j++; break; }                              // comilla de cierre
    if (c === "$" && code[j+1] === "{") {
      if (lit) { out += span("tok-str", lit); lit = ""; }
      let d = 1, k = j + 2;                                               // balancea llaves anidadas
      while (k < n && d > 0) { const ch = code[k]; if (ch === "{") d++; else if (ch === "}") { d--; if (d === 0) break; } k++; }
      out += span("tok-idelim", "${") + highlight(code.slice(j + 2, k)) + (code[k] === "}" ? span("tok-idelim", "}") : "");
      j = code[k] === "}" ? k + 1 : k;
      continue;
    }
    lit += c; j++;
  }
  if (lit) out += span("tok-str", lit);
  return [out, j];
}
function highlight(code){
  let out = "", i = 0; const n = code.length;
  const isIdStart = c => /[A-Za-z_]/.test(c), isId = c => /[A-Za-z0-9_]/.test(c);
  const scanStr = (j, q) => { j++; while (j < n && code[j] !== q) { if (code[j] === "\\") j++; j++; } return j + 1; };
  while (i < n) {
    const c = code[i];
    if (c === "/" && code[i+1] === "/") { let j = i; while (j < n && code[j] !== "\n") j++; out += span("tok-com", code.slice(i, j)); i = j; }
    else if (c === '"') { const [h, j] = hlString(code, i); out += h; i = j; }
    else if (c === "b" && code[i+1] === '"') { const j = scanStr(i+1, '"'); out += span("tok-str", code.slice(i, j)); i = j; }
    else if (c === "'") { const j = scanStr(i, "'"); out += span("tok-str", code.slice(i, j)); i = j; }
    else if (c === "@") { let j = i+1; while (j < n && isId(code[j])) j++; out += span("tok-ann", code.slice(i, j)); i = j; }
    else if (/[0-9]/.test(c)) { let j = i; while (j < n && /[0-9._eExXa-fA-F]/.test(code[j])) j++; out += span("tok-num", code.slice(i, j)); i = j; }
    else if (isIdStart(c)) {
      let j = i; while (j < n && isId(code[j])) j++; const w = code.slice(i, j);
      let k = j; while (k < n && /\s/.test(code[k])) k++;
      let cls = KW.has(w) ? "tok-kw" : TY.has(w) ? "tok-ty" : LIT.has(w) ? "tok-lit"
              : (w === "self" || w === "Self") ? "tok-kw"
              : /^[A-Z]/.test(w) ? "tok-ty"
              : code[k] === "(" ? "tok-fn" : null;
      out += cls ? span(cls, w) : esc(w); i = j;
    }
    else { out += esc(c); i++; }
  }
  return out;
}
function render(){
  hlEl.innerHTML = highlight(srcEl.value);
  hlEl.parentNode.scrollTop = srcEl.scrollTop;
  hlEl.parentNode.scrollLeft = srcEl.scrollLeft;
}

let wasm = null;
async function cargar() {
  try {
    // `instantiateStreaming` necesita MIME `application/wasm`; si falla (p. ej. file://), cae a ArrayBuffer.
    let mod;
    try {
      mod = await WebAssembly.instantiateStreaming(fetch("raylang.wasm"), {});
    } catch {
      const bytes = await (await fetch("raylang.wasm")).arrayBuffer();
      mod = await WebAssembly.instantiate(bytes, {});
    }
    wasm = mod.instance.exports;
    statusEl.textContent = "listo";
    runEl.disabled = false;
  } catch (e) {
    statusEl.textContent = "no se pudo cargar raylang.wasm — sírvelo por HTTP (ver README)";
    outEl.textContent = String(e);
  }
}

function ejecutar() {
  if (!wasm) return;
  const { memory, alloc, run, dealloc } = wasm;
  const enc = new TextEncoder().encode(srcEl.value);
  const p = alloc(enc.length);
  new Uint8Array(memory.buffer, p, enc.length).set(enc);
  const packed = run(p, enc.length);              // BigInt (u64)
  const ptr = Number(packed >> 32n), len = Number(packed & 0xffffffffn);
  const salida = new TextDecoder().decode(new Uint8Array(memory.buffer, ptr, len));
  dealloc(ptr, len);
  outEl.textContent = salida || "(sin salida)";
}

// --- Panel lateral de "archivos" ---
// Cada ejemplo se presenta como un archivo .ray. Al seleccionarlo se carga en el editor y se LIMPIA la
// salida (empiezas de cero, como al abrir otro archivo). El icono de cada archivo es el símbolo de raylang.
const ARCHIVOS = [
  ["fib.ray", "fib"], ["genericos.ray", "genéricos"], ["enums.ray", "enums"], ["traits.ray", "traits"],
  ["errores.ray", "errores"], ["iteradores.ray", "iteradores"], ["dyn.ray", "dyn"], ["concurrencia.ray", "concurrencia"],
];
const ICONO = `<svg width="14" height="13" viewBox="0 20 200 184"><path d="M100 50 C108 49 113 53 115 60 C150 66 175 84 191 116 C166 127 141 137 119 150 C111 154 105 159 100 165 C95 159 89 154 81 150 C59 137 34 127 9 116 C25 84 50 66 85 60 C87 53 92 49 100 50 Z" fill="#2B7CE0"/><path d="M93 55 C90 45 88 38 87 30" stroke="#2B7CE0" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M107 55 C110 45 112 38 113 30" stroke="#2B7CE0" stroke-width="7" stroke-linecap="round" fill="none"/></svg>`;
let archivoActivo = null;
function abrirArchivo(nombre, clave, li) {
  srcEl.value = EJEMPLOS[clave];
  render();
  outEl.textContent = "";                 // limpia la salida al cambiar de archivo
  fileLabelEl.textContent = nombre;
  if (archivoActivo) archivoActivo.classList.remove("active");
  li.classList.add("active");
  archivoActivo = li;
}
let primerLi = null;
for (const [nombre, clave] of ARCHIVOS) {
  const li = document.createElement("li");
  li.className = "file";
  li.innerHTML = ICONO + `<span>${nombre}</span>`;
  li.onclick = () => abrirArchivo(nombre, clave, li);
  filesEl.appendChild(li);
  if (!primerLi) primerLi = li;
}

runEl.onclick = ejecutar;
// Re-resaltar al escribir; sincronizar el scroll de la capa coloreada con el textarea.
srcEl.addEventListener("input", render);
srcEl.addEventListener("scroll", () => { hlEl.parentNode.scrollTop = srcEl.scrollTop; hlEl.parentNode.scrollLeft = srcEl.scrollLeft; });
// Tab inserta 4 espacios (indentación) en vez de mover el foco.
srcEl.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = srcEl.selectionStart, t = srcEl.selectionEnd;
    srcEl.value = srcEl.value.slice(0, s) + "    " + srcEl.value.slice(t);
    srcEl.selectionStart = srcEl.selectionEnd = s + 4;
    render();
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); ejecutar(); }
});

abrirArchivo(ARCHIVOS[0][0], ARCHIVOS[0][1], primerLi);   // abre fib.ray al arrancar
cargar();
</script>
</body>
</html>
