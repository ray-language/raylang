<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raylang · playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 20 200 184'%3E%3Cpath d='M100 50 C108 49 113 53 115 60 C150 66 175 84 191 116 C166 127 141 137 119 150 C111 154 105 159 100 165 C95 159 89 154 81 150 C59 137 34 127 9 116 C25 84 50 66 85 60 C87 53 92 49 100 50 Z' fill='%232B7CE0'/%3E%3Cpath d='M93 55 C90 45 88 38 87 30' stroke='%232B7CE0' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3Cpath d='M107 55 C110 45 112 38 113 30' stroke='%232B7CE0' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
  /* Fuentes de marca embebidas (SIL OFL 1.1; ver fonts/README.md). Space Grotesk (UI/títulos) es variable
     300–700; JetBrains Mono (editor de código) es regular. `swap` para no bloquear el render. */
  @font-face { font-family:"Space Grotesk"; src:url("fonts/space-grotesk.woff2") format("woff2"); font-weight:300 700; font-display:swap; }
  @font-face { font-family:"JetBrains Mono"; src:url("fonts/jetbrains-mono.woff2") format("woff2"); font-weight:400; font-display:swap; }
  /* Colores de marca raylang: azul primario #2B7CE0, navy #0B1F33, acentos. */
  :root { color-scheme: dark; --bg:#0b1622; --panel:#0e1c2e; --border:#1e3454; --fg:#e6edf3; --accent:#2B7CE0; --muted:#8fa6c4; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--border); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .tag { color:var(--muted); font-size:12px; }
  header .sp { flex:1; }
  button { background:var(--accent); color:#04122a; border:0; border-radius:6px; padding:7px 16px; font-weight:600; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border); height:calc(100vh - 54px); }
  @media (max-width:800px){ main{ grid-template-columns:1fr; grid-template-rows:1fr 1fr; } }
  .pane { background:var(--panel); display:flex; flex-direction:column; min-width:0; min-height:0; }
  .pane .label { padding:6px 14px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.04em; }
  textarea, pre { flex:1; margin:0; border:0; padding:14px; background:transparent; color:var(--fg);
    font:13px/1.5 "JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace; resize:none; overflow:auto; tab-size:4; white-space:pre; }
  textarea:focus { outline:none; }
  pre { color:#c9d1d9; }
  .ejemplos { display:flex; gap:6px; flex-wrap:wrap; }
  .ejemplos a { color:var(--accent); font-size:12px; text-decoration:none; cursor:pointer; }
  .ejemplos a:hover { text-decoration:underline; }
  .status { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <svg width="26" height="24" viewBox="0 20 200 184" aria-hidden="true" style="flex:none">
    <path d="M100 50 C108 49 113 53 115 60 C150 66 175 84 191 116 C166 127 141 137 119 150 C111 154 105 159 100 165 C95 159 89 154 81 150 C59 137 34 127 9 116 C25 84 50 66 85 60 C87 53 92 49 100 50 Z" fill="#2B7CE0"/>
    <path d="M93 55 C90 45 88 38 87 30" stroke="#2B7CE0" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M107 55 C110 45 112 38 113 30" stroke="#2B7CE0" stroke-width="7" stroke-linecap="round" fill="none"/>
  </svg>
  <h1>raylang <span class="tag">· playground</span></h1>
  <span class="ejemplos" id="ejemplos"></span>
  <span class="sp"></span>
  <span class="status" id="status">cargando…</span>
  <button id="run" disabled>▶ Ejecutar (⌘/Ctrl+Enter)</button>
</header>
<main>
  <div class="pane">
    <div class="label">fuente</div>
    <textarea id="src" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="label">salida</div>
    <pre id="out"></pre>
  </div>
</main>

<script type="module">
// M44a-3: glue del playground. ABI cruda contra el .wasm de raylang (sin wasm-bindgen): alloc → escribir
// el fuente → run(ptr,len) → u64 empaquetado (ptr<<32|len) → leer la salida → dealloc.
const EJEMPLOS = {
  "fib": `fn fib(n: int) -> int {
    if (n < 2) { n } else { fib(n - 1) + fib(n - 2) }
}
fn main() -> int {
    var i = 0;
    while (i < 15) { print(fib(i)); i = i + 1; }
    0
}`,
  "genéricos": `fn id<T>(x: T) -> T { x }
fn main() -> int {
    print(id(42));
    print(id("hola"));
    let xs = [1, 2, 3, 4, 5];
    let cuadrados = xs.map(fn(x: int) -> int { x * x });
    let suma = cuadrados.fold(0, fn(a: int, b: int) -> int { a + b });
    print(suma);
    0
}`,
  "enums": `enum Figura { Circulo(float), Rect(float, float) }
fn area(f: Figura) -> float {
    match (f) {
        Figura.Circulo(r) => 3.14159 * r * r,
        Figura.Rect(w, h) => w * h,
    }
}
fn main() -> int {
    print(area(Figura.Circulo(2.0)));
    print(area(Figura.Rect(3.0, 4.0)));
    0
}`,
  "traits": `trait Saludar { fn hola(self) -> string }
struct Persona { nombre: string }
impl Saludar for Persona {
    fn hola(self) -> string { "hola, " + self.nombre }
}
fn main() -> int {
    let p = Persona { nombre: "raylang" };
    print(p.hola());
    0
}`,
};

const $ = (id) => document.getElementById(id);
const srcEl = $("src"), outEl = $("out"), runEl = $("run"), statusEl = $("status");

let wasm = null;
async function cargar() {
  try {
    // `instantiateStreaming` necesita MIME `application/wasm`; si falla (p. ej. file://), cae a ArrayBuffer.
    let mod;
    try {
      mod = await WebAssembly.instantiateStreaming(fetch("raylang.wasm"), {});
    } catch {
      const bytes = await (await fetch("raylang.wasm")).arrayBuffer();
      mod = await WebAssembly.instantiate(bytes, {});
    }
    wasm = mod.instance.exports;
    statusEl.textContent = "listo";
    runEl.disabled = false;
  } catch (e) {
    statusEl.textContent = "no se pudo cargar raylang.wasm — sírvelo por HTTP (ver README)";
    outEl.textContent = String(e);
  }
}

function ejecutar() {
  if (!wasm) return;
  const { memory, alloc, run, dealloc } = wasm;
  const enc = new TextEncoder().encode(srcEl.value);
  const p = alloc(enc.length);
  new Uint8Array(memory.buffer, p, enc.length).set(enc);
  const packed = run(p, enc.length);              // BigInt (u64)
  const ptr = Number(packed >> 32n), len = Number(packed & 0xffffffffn);
  const salida = new TextDecoder().decode(new Uint8Array(memory.buffer, ptr, len));
  dealloc(ptr, len);
  outEl.textContent = salida || "(sin salida)";
}

// Botones de ejemplo.
const ejEl = $("ejemplos");
for (const nombre of Object.keys(EJEMPLOS)) {
  const a = document.createElement("a");
  a.textContent = nombre;
  a.onclick = () => { srcEl.value = EJEMPLOS[nombre]; };
  ejEl.appendChild(a);
}

runEl.onclick = ejecutar;
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); ejecutar(); }
});

srcEl.value = EJEMPLOS["fib"];
cargar();
</script>
</body>
</html>
